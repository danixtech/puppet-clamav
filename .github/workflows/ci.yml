name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_WITHOUT: system_tests
  PUPPET_GEM_VERSION: "~> 8.0"

jobs:
  validate:
    name: Validate (Puppet 8 / Ruby 3.3)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Validate metadata and syntax
        run: bundle exec rake validate

      - name: Check Ruby style
        run: bundle exec rake rubocop

  compatibility:
    name: Focused compatibility (Puppet 8 / Ruby 3.3)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Prepare fixtures
        run: bundle exec rake spec_prep

      - name: Run focused compatibility tests
        run: >-
          bundle exec rspec
          spec/classes/clamav_clamd_default_options_compatibility_spec.rb
          spec/classes/clamav_clamd_options_spec.rb
          spec/classes/clamav_debian_compatibility_spec.rb
          spec/classes/clamav_priority_platforms_spec.rb
          spec/classes/clamav_public_input_compatibility_spec.rb
          spec/classes/clamav_redhat_compatibility_spec.rb
          spec/classes/clamav_resolved_variables_spec.rb
          spec/classes/clamav_service_behavior_spec.rb
          --format progress

  legacy_epel:
    name: Legacy EL7.9 and EL9 EPEL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Prepare pinned puppet/epel 5.0.0 fixture
        run: bundle exec rake spec_prep

      - name: Run real EPEL integration tests
        run: >-
          bundle exec rspec
          spec/classes/clamav_epel_integration_spec.rb
          --format progress
