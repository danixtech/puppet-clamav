name: Runtime acceptance

on:
  push:
    branches:
      - modernization
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    name: Litmus (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - smoke
          - ubuntu-2404

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Prepare Litmus fixtures
        run: bundle exec rake spec_prep

      - name: Provision target
        run: bundle exec rake "litmus:provision_list[${{ matrix.target }}]"

      - name: Install Puppet 8
        run: bundle exec rake "litmus:install_agent[puppet8]"

      - name: Install module under test
        run: bundle exec rake litmus:install_module

      - name: Run acceptance suite
        env:
          RSPEC_DEBUG: "true"
        run: bundle exec rake litmus:acceptance:parallel

      - name: Tear down targets
        if: always()
        run: bundle exec rake litmus:tear_down
