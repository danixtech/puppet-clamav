name: Runtime acceptance

on:
  push:
    branches:
      - modernization
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    name: Litmus (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - smoke
          - ubuntu-2404
          - debian-12
          - alma-9

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Prepare Litmus fixtures
        run: bundle exec rake spec_prep

      - name: Provision target
        run: bundle exec rake "litmus:provision_list[${{ matrix.target }}]"

      # The linux/amd64 AlmaLinux 9 Litmus image currently has a locked root
      # account, unlike its arm64 variant and the other Litmus images.
      - name: Repair AlmaLinux Litmus SSH access
        if: matrix.target == 'alma-9'
        run: |
          container_id="$(ruby -ryaml -e "puts YAML.load_file('spec/fixtures/litmus_inventory.yaml').dig('groups', 0, 'targets', 0, 'facts', 'container_id')")"
          docker exec "${container_id}" sh -c "echo root:root | chpasswd"
          docker exec "${container_id}" sh -c "printf '\\nPermitRootLogin yes\\nPasswordAuthentication yes\\n' >> /etc/ssh/sshd_config"
          docker exec "${container_id}" systemctl restart sshd

      - name: Install Puppet 8
        run: bundle exec rake "litmus:install_agent[puppet8]"

      - name: Install module under test
        run: bundle exec rake litmus:install_module

      - name: Run acceptance suite
        env:
          RSPEC_DEBUG: "true"
        run: bundle exec rake litmus:acceptance:parallel

      - name: Tear down targets
        if: always()
        run: bundle exec rake litmus:tear_down
