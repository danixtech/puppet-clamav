name: Runtime acceptance

on:
  push:
    branches:
      - modernization
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    name: Litmus (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - smoke
          - ubuntu-2404
          - debian-12
          - alma-9

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Prepare Litmus fixtures
        run: bundle exec rake spec_prep

      - name: Provision target
        run: bundle exec rake "litmus:provision_list[${{ matrix.target }}]"

      # The linux/amd64 AlmaLinux 9 Litmus image currently rejects its
      # documented root password, unlike its arm64 variant and other images.
      - name: Repair AlmaLinux Litmus SSH access
        if: matrix.target == 'alma-9'
        run: |
          container_id="$(ruby -ryaml -e "puts YAML.load_file('spec/fixtures/litmus_inventory.yaml').dig('groups', 0, 'targets', 0, 'facts', 'container_id')")"
          ssh-keygen -q -t ecdsa -b 256 -m PEM -N '' -f /tmp/litmus_ci_key
          root_password="$(openssl rand -base64 24)"
          docker exec "${container_id}" sh -c "echo root:${root_password} | chpasswd"
          docker exec "${container_id}" mkdir -p /root/.ssh
          docker cp /tmp/litmus_ci_key.pub "${container_id}:/root/.ssh/authorized_keys"
          docker exec "${container_id}" chown -R root:root /root/.ssh
          docker exec "${container_id}" chmod 700 /root/.ssh
          docker exec "${container_id}" chmod 600 /root/.ssh/authorized_keys
          docker exec "${container_id}" sh -c "printf 'PermitRootLogin yes\\n' > /etc/ssh/sshd_config.d/00-litmus.conf"
          docker exec "${container_id}" /usr/sbin/sshd -t
          docker exec "${container_id}" pkill -HUP -x sshd
          ruby -ryaml -e "path = 'spec/fixtures/litmus_inventory.yaml'; inventory = YAML.load_file(path); ssh = inventory.dig('groups', 0, 'targets', 0, 'config', 'ssh'); ssh.delete('password'); ssh['private-key'] = '/tmp/litmus_ci_key'; File.write(path, inventory.to_yaml)"

      - name: Install Puppet 8
        run: bundle exec rake "litmus:install_agent[puppet8]"

      - name: Install module under test
        run: bundle exec rake litmus:install_module

      - name: Run acceptance suite
        env:
          RSPEC_DEBUG: "true"
        run: bundle exec rake litmus:acceptance:parallel

      - name: Tear down targets
        if: always()
        run: bundle exec rake litmus:tear_down
