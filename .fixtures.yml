# This file can be used to install module dependencies for unit testing
# See https://github.com/puppetlabs/puppetlabs_spec_helper#using-fixtures for details
---
fixtures:
  forge_modules:
    stdlib: "puppetlabs/stdlib"
    # 5.0.0 is the newest release that supports legacy EL7 while retaining
    # Puppet 7 and Puppet 8 compatibility. EL10 repository integration is
    # tested separately from the Puppet unit fixture.
    epel:
      repo: "puppet/epel"
      ref: "5.0.0"
    # Extracted from core in puppet 6
    yumrepo_core: "puppetlabs/yumrepo_core"
  symlinks:
    clamav: "#{source_dir}"
